name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - public/**
      - vercel.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@59.14.0
      - name: Verify deployment target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const headers = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const query = new URLSearchParams({ teamId: process.env.VERCEL_ORG_ID });
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?${query}`, { headers });
          const project = await response.json();
          if (!response.ok) throw new Error(`Project access failed (${response.status}): ${project.error?.message}`);
          if (project.accountId !== 'team_NI6RY3w0UOIKwEyPPiGW6pbx' || project.name !== 'hsincode.com') throw new Error('Unexpected deployment target.');
          console.log('Verified HsinCode project:', project.name);
          NODE
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --scope hsincode --token "$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --scope hsincode --token "$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --yes --scope hsincode --token "$VERCEL_TOKEN"
      - name: Check website
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://hsincode.com/ --output /dev/null
