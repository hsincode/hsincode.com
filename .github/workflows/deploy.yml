name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - public/**
      - vercel.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@59.14.0
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Check website
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://hsincode.com/ --output /dev/null
