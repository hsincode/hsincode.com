<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f9f9f8">
    <link rel="icon" href="../../assets/avatar.png">
    <link rel="stylesheet" href="../samples.css">
    <script src="../motion.js" type="module"></script>
    <title>Trace | HsinCode</title>

  <body class="concept trace" data-concept="trace">
    <div class="concept-page">
      <header class="sample-header">
        <a class="back-link" href="../"><img src="../../assets/arrow-up-left.svg" width="18" height="18" alt="">Samples</a>
        <span class="edition">A / Trace</span>
      </header>
      <main class="trace-main">
        <div class="identity"><img class="avatar" src="../../assets/avatar.png" width="56" height="56" alt="HsinCode"><span>@hsincode</span></div>
        <h1 class="kinetic-title" aria-label="HsinCode"><span aria-hidden="true">H</span><span aria-hidden="true">s</span><span aria-hidden="true">i</span><span aria-hidden="true">n</span><span aria-hidden="true">C</span><span aria-hidden="true">o</span><span aria-hidden="true">d</span><span aria-hidden="true">e</span><span class="accent" aria-hidden="true">.</span></h1>
        <div class="trace-rule" aria-hidden="true"><span></span></div>
        <div class="trace-links"><span class="signature" aria-hidden="true">心</span><a class="outbound" href="https://github.com/hsincode">GitHub<img src="../../assets/arrow-up-right.svg" width="22" height="22" alt=""></a></div>
      </main>
      <footer class="concept-footer">
        <span>hsincode.com</span>
        <button class="motion-toggle" type="button" aria-pressed="false" aria-label="アニメーションを一時停止" title="アニメーションを一時停止" hidden><img class="pause-icon" src="../../assets/pause.svg" width="18" height="18" alt=""><img class="play-icon" src="../../assets/play.svg" width="18" height="18" alt=""></button>
        <a href="../resonance/">B / Resonance<img src="../../assets/arrow-right.svg" width="18" height="18" alt=""></a>
      </footer>
    </div>
